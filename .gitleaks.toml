# Keep every default rule; add one narrowly-scoped exemption.
[extend]
useDefault = true

# packages/data/art-keys.json is generated by scripts/scrape-images.ts and holds
# nothing but public bazaardb.gg CDN filenames — sha1 hex, fetched from a public
# site, served to every viewer by the art proxy.
#
# gitleaks' generic-api-key rule scores them as secrets because they are long
# high-entropy hex sitting next to a quoted key, and several cards are literally
# named "Secret Formula", "Book of Secrets", "Frozen Secrets" — the keyword the
# rule looks for is the card's own name.
#
# Scoped deliberately tight: this path AND a bare 40-hex value. A real credential
# pasted into this file would not match the value pattern and would still be
# caught, and no other file is affected.
[[allowlists]]
description = "public card-art cdn hashes (generated, not secrets)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''packages/data/art-keys\.json$''']
regexTarget = "secret"
regexes = ['''^[a-f0-9]{40}$''']
