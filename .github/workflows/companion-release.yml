name: Build Companion

on:
  push:
    tags: ['companion-v*']
  # manual re-run: a tag push silently failed to trigger a build once, and with a
  # streamer waiting on the binary there has to be a way to kick it without inventing
  # a throwaway version number. run it against the tag you want to publish.
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r packages/companion/requirements.txt
          pip install "pyinstaller>=6,<7"

      - name: Build exe
        run: |
          cd packages/companion
          pyinstaller --onefile --name bazaarinfo-companion --console --icon NONE logwatch.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-windows
          path: packages/companion/dist/bazaarinfo-companion.exe

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r packages/companion/requirements.txt
          pip install "pyinstaller>=6,<7"

      - name: Build binary
        run: |
          cd packages/companion
          pyinstaller --onefile --name bazaarinfo-companion --console logwatch.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-linux
          path: packages/companion/dist/bazaarinfo-companion

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # provenance attestation: cryptographic proof each binary was built by this
      # public workflow from the tagged source — the trust anchor for unsigned exes
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: companion-windows
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: companion-linux
          path: artifacts/linux

      - name: Rename artifacts
        run: |
          mv artifacts/windows/bazaarinfo-companion.exe artifacts/bazaarinfo-companion-windows.exe
          mv artifacts/linux/bazaarinfo-companion artifacts/bazaarinfo-companion-linux
          chmod +x artifacts/bazaarinfo-companion-linux

      - name: Checksums
        run: |
          cd artifacts
          sha256sum bazaarinfo-companion-windows.exe bazaarinfo-companion-linux > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/bazaarinfo-companion-windows.exe
            artifacts/bazaarinfo-companion-linux

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          name: "BazaarInfo Companion ${{ github.ref_name }}"
          body: |
            ## BazaarInfo Companion

            Streams your card data to the BazaarInfo Twitch overlay so viewers can see card tooltips,
            and — if Hearthstone is on the same machine — follows your Battlegrounds games so the
            chat bot can answer questions about your live board.

            ### setup
            1. Install the [BazaarInfo extension](https://dashboard.twitch.tv/extensions/nlhnk69thm8drl49k4h7v18u3365fu) on your Twitch channel
            2. Go to Extensions > BazaarInfo > Configure to get your Channel ID and Secret
            3. Download the companion for your platform below
            4. Run it and enter your Channel ID and Secret when prompted
            5. Launch The Bazaar and start a game — the overlay will show card tooltips automatically

            ### battlegrounds (optional, automatic)
            Nothing to set up. If Hearthstone is installed the companion finds it, switches on Power
            logging if no tracker already has (it appends a `[Power]` section and leaves other
            trackers' settings alone), and restarting Hearthstone once turns it on. Already running
            Hearthstone Deck Tracker? Then logging is on and there is nothing to do — the two don't
            conflict, HDT keeps drawing the board for viewers and this only feeds the chat bot.

            It reads your board, hero, tavern tier, health, placement, the lobby standings and your
            current opponent — all of it already on your stream. It does not read your shop or your
            hand.

            ### downloads
            - **Windows**: `bazaarinfo-companion-windows.exe` — double-click to run
            - **Linux**: `bazaarinfo-companion-linux` — `chmod +x` and run

            Settings are saved to `config.ini` next to the executable. Run with `--setup` to reconfigure.

            ### verify your download (optional, recommended)
            Every binary here is built by this repo's public CI and ships with cryptographic proof:
            - **integrity** — compare against `SHA256SUMS`:
              - Windows: `certutil -hashfile bazaarinfo-companion-windows.exe SHA256`
              - Linux: `sha256sum -c SHA256SUMS --ignore-missing`
            - **provenance** — prove it was built from this exact tagged source by GitHub's CI, not tampered with or swapped ([GitHub CLI](https://cli.github.com)):
              - `gh attestation verify bazaarinfo-companion-windows.exe --repo mellen9999/bazaarinfo`
            - **or skip binaries entirely** — the companion is two readable Python files; run it from source: `python packages/companion/logwatch.py`

            Windows SmartScreen may warn on first run because the exe is unsigned (code-signing certs are a paid identity service, not a security measure) — the attestation above is the stronger, free proof of where this binary came from.
          files: |
            artifacts/bazaarinfo-companion-windows.exe
            artifacts/bazaarinfo-companion-linux
            artifacts/SHA256SUMS
          draft: false
          prerelease: false
