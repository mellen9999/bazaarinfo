name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # self.ts reads the last 14 commits for "what's new"; a depth-1 clone whose
          # head is a docs/chore commit leaves it nothing to show and fails the test
          fetch-depth: 20

      - uses: oven-sh/setup-bun@v2

      - name: install deps
        run: bun install --frozen-lockfile

      # card-cache-dependent tests (real-store e2e) need cache/items.json, which is
      # gitignored on dev machines — restore the committed snapshot on ci runners
      - name: restore card cache fixture
        run: mkdir -p cache && gunzip -c packages/bot/test/fixtures/items.json.gz > cache/items.json

      - name: typecheck
        run: bun run typecheck

      - name: test
        run: bun run test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install deps
        run: pip install pytest -r packages/companion/requirements.txt

      - name: test
        run: python -m pytest packages/companion/ -q
