<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'">
<title>bazaarinfo panel</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="app">

  <div id="login-screen" class="screen" hidden>
    <div class="login-box">
      <div class="login-title">bazaarinfo</div>
      <div class="login-sub">mods only</div>
      <a id="login-link" class="btn login-link" href="/auth/login">log in with twitch</a>
    </div>
  </div>

  <div id="main-screen" class="screen" hidden>

    <header id="header" class="header">
      <div class="header-group">
        <span class="brand">bazaarinfo</span>
        <nav id="channel-tabs" class="channel-tabs"></nav>
      </div>
      <div class="header-group header-right">
        <span id="whoami" class="whoami"></span>
        <button id="logout-btn" class="btn" type="button" title="sign out of this panel">logout</button>
      </div>
    </header>

    <div id="status-line" class="status-line"></div>

    <div id="cmdbar" class="cmdbar">
      <span class="cmdbar-prefix">:</span>
      <input id="cmd-input" class="cmd-input" type="text" autocomplete="off" spellcheck="false"
        title="type a command in plain english, then enter to run it"
        placeholder="plain english, e.g. pause trivia for an hour">
      <span id="cmd-preview" class="cmd-preview"></span>
    </div>

    <div id="grid" class="grid">
      <section class="pane" id="pane-switches" data-pane="switches">
        <h2 class="pane-title">switches</h2>
        <div class="pane-body" id="switches-body"></div>
      </section>

      <section class="pane" id="pane-chatrules" data-pane="chatrules">
        <h2 class="pane-title">chat rules</h2>
        <div class="pane-body" id="chatrules-body"></div>
      </section>

      <section class="pane" id="pane-trivia" data-pane="trivia">
        <h2 class="pane-title">trivia</h2>
        <div class="pane-body" id="trivia-body">
          <div id="trivia-round" class="row"></div>
          <div id="trivia-cd"></div>
          <div id="trivia-queue" class="list-scroll"></div>
          <div class="dim">banned topics</div>
          <div id="trivia-bans" class="list-scroll"></div>
          <div class="pane-controls">
            <input id="topic-input" type="text" placeholder="topic (optional)" title="what the round should be about — leave blank for a random one" autocomplete="off" spellcheck="false">
            <button id="trivia-start-btn" type="button" title="start a trivia round now">start</button>
            <button id="trivia-skip-btn" type="button" title="end the round that's running now">skip</button>
          </div>
        </div>
      </section>

      <section class="pane" id="pane-questions" data-pane="questions">
        <h2 class="pane-title" id="questions-title">questions</h2>
        <div class="pane-body" id="questions-body"></div>
      </section>

      <section class="pane" id="pane-activity" data-pane="activity">
        <h2 class="pane-title">activity</h2>
        <div class="pane-body" id="activity-body"></div>
      </section>

      <section class="pane" id="pane-people" data-pane="people">
        <h2 class="pane-title">people</h2>
        <div class="pane-body" id="people-body">
          <div class="dim">ignoring</div>
          <div id="people-ignored" class="list-scroll"></div>
          <div class="pane-controls">
            <input id="ignore-input" type="text" placeholder="@user" title="stop the bot from replying to this person" autocomplete="off" spellcheck="false">
            <button id="ignore-1h-btn" type="button" title="ignore for 1 hour">1h</button>
            <button id="ignore-24h-btn" type="button" title="ignore for 24 hours">24h</button>
            <button id="ignore-7d-btn" type="button" title="ignore for 7 days">7d</button>
            <button id="ignore-forever-btn" type="button" title="ignore until a mod lifts it">forever</button>
          </div>
          <div class="dim">timed out by twitch</div>
          <div id="people-timedout" class="list-scroll"></div>
          <div class="dim">top askers today</div>
          <div id="people-top" class="list-scroll"></div>
        </div>
      </section>

      <section class="pane" id="pane-raidgeon" data-pane="raidgeon">
        <h2 class="pane-title">raid + dungeon</h2>
        <div class="pane-body" id="raidgeon-body"></div>
      </section>

      <section class="pane" id="pane-log" data-pane="log">
        <h2 class="pane-title">log</h2>
        <div class="pane-body" id="log-body"></div>
      </section>
    </div>

    <div id="admin-strip" class="admin-strip" hidden>
      <span class="admin-label">admin</span>
      <input id="join-input" class="admin-input" type="text" placeholder="channel to join" title="a twitch channel name for the bot to join" autocomplete="off" spellcheck="false">
      <button id="join-btn" class="btn" type="button" title="make the bot join that channel's chat">join</button>
      <button id="part-btn" class="btn" type="button" title="make the bot leave this channel's chat (confirm)">leave current</button>
    </div>

    <div id="say-row" class="say-row" hidden>
      <span class="say-prefix">say</span>
      <input id="say-input" class="say-input" type="text" placeholder="message to chat" title="send this exact message to chat, as the bot" autocomplete="off" spellcheck="false" maxlength="450">
      <button id="say-btn" class="btn" type="button" title="post this message to chat as the bot">send</button>
    </div>

    <div id="action-status" class="status-line" hidden></div>
  </div>

  <div id="help-overlay" class="help-overlay" hidden></div>

</div>
<script type="module" src="panel.js"></script>
</body>
</html>
